<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#1C2E24"/>
  <!-- Camera timestamp overlay -->
  <text x="16" y="28" fill="#4ADE80" font-family="monospace" font-size="12">CAM-NODE-01 [RURAL-PWMU HARDWARE NODE]</text>
  <text x="16" y="46" fill="#86EFAC" font-family="monospace" font-size="10">SCALE: LOAD-CELL LC402 | CAL: VERIFIED OK</text>
  <!-- Weighing platform -->
  <rect x="40" y="230" width="320" height="24" rx="3" fill="#2E4A3B" stroke="#4B775E" stroke-width="2"/>
  <!-- Plastic bale body -->
  <rect x="75" y="85" width="250" height="145" rx="8" fill="#18432D" stroke="#22C55E" stroke-width="2.5"/>
  <!-- Bale wire straps -->
  <line x1="125" y1="85" x2="125" y2="230" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="200" y1="85" x2="200" y2="230" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="275" y1="85" x2="275" y2="230" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="8,4"/>
  <!-- Bale texture ripples -->
  <path d="M85,115 Q125,100 170,120 T260,110 T315,125" fill="none" stroke="#2E7D32" stroke-width="2" opacity="0.8"/>
  <path d="M90,150 Q145,135 200,155 T290,145 T320,160" fill="none" stroke="#4ADE80" stroke-width="1.8" opacity="0.6"/>
  <path d="M85,185 Q135,170 210,190 T290,180 T315,195" fill="none" stroke="#2E7D32" stroke-width="2" opacity="0.8"/>
  <!-- Hardware QR tag sticker on bale -->
  <rect x="235" y="98" width="70" height="70" rx="4" fill="#FFFFFF" stroke="#14281D" stroke-width="2"/>
  <rect x="243" y="106" width="18" height="18" fill="#14281D"/>
  <rect x="277" y="106" width="18" height="18" fill="#14281D"/>
  <rect x="243" y="140" width="18" height="18" fill="#14281D"/>
  <rect x="268" y="131" width="8" height="8" fill="#14281D"/>
  <rect x="281" y="142" width="8" height="8" fill="#14281D"/>
  <text x="240" y="164" fill="#14281D" font-family="monospace" font-size="7" font-weight="bold">BALE-1132</text>
  <!-- Load cell digital indicator box -->
  <rect x="280" y="202" width="70" height="22" rx="3" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="288" y="217" fill="#22C55E" font-family="monospace" font-size="10" font-weight="bold">SCALE READY</text>
</svg>